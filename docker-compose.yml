services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: anfitria
      POSTGRES_PASSWORD: anfitria
      POSTGRES_DB: anfitria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anfitria"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://anfitria:anfitria@db:5432/anfitria
      REDIS_URL: redis://redis:6379/0
      # IA: por defecto mock. Para usar Claude, crea un .env con
      # AI_PROVIDER=anthropic y ANTHROPIC_API_KEY=sk-ant-...
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Canal: sim por defecto. Para WhatsApp real: CHANNEL_PROVIDER=whatsapp_cloud
      # y las credenciales de Meta (ver docs/WHATSAPP.md).
      CHANNEL_PROVIDER: ${CHANNEL_PROVIDER:-sim}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: uv run arq app.worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql+asyncpg://anfitria:anfitria@db:5432/anfitria
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
